<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>地理動画エディター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&family=Kaisei+Tokumin:wght@800&family=Noto+Serif+JP:wght@900&family=Zen+Old+Mincho:wght@900&family=Shippori+Mincho+B1:wght@800&family=Zen+Antique&family=Potta+One&family=Yuji+Boku&family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@900&family=Cinzel:wght@700;900&family=Cinzel+Decorative:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14161c; --panel:#1c1f27; --panel2:#232733; --line:#2f3442; --text:#e9ecf3; --mute:#8b93a7;
  --acc:#ffb020; --acc2:#3d8bff; --danger:#ff5a6a; --ok:#33d17a;
  --r:8px; font-family:"M PLUS Rounded 1c","Hiragino Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-size:13px}
body{display:grid;grid-template-rows:46px 1fr 220px;grid-template-columns:310px 1fr 320px;height:100vh;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:#4a5166;background:#2a2f3d}
button.pri{background:var(--acc);color:#1b1300;border-color:var(--acc);font-weight:800}
button.pri:hover{filter:brightness(1.08)}
button.ghost{background:transparent}
button.danger{color:var(--danger)}
button:disabled{opacity:.45;cursor:default}
input[type=text],input[type=number],input:not([type]),select,textarea{background:#12141a;border:1px solid var(--line);border-radius:6px;padding:5px 7px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc2)}
input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=checkbox]{accent-color:var(--acc)}
textarea{resize:vertical;min-height:54px}
label.f{display:block;margin:0 0 9px}
label.f>span{display:block;color:var(--mute);font-size:11.5px;margin-bottom:3px}
.row{display:flex;gap:6px;align-items:center}
.row>*{flex:1}
.row>.nf{flex:0 0 auto}
.mute{color:var(--mute)}
.small{font-size:11.5px}
h3{font-size:12px;letter-spacing:.06em;color:var(--mute);margin:14px 0 8px;font-weight:800;text-transform:uppercase}
h3:first-child{margin-top:2px}
.hint{color:var(--mute);font-size:11.5px;line-height:1.55;margin:4px 0 10px}

/* header */
header{grid-column:1/-1;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header .logo{font-weight:900;font-size:15px;letter-spacing:.02em;margin-right:6px}
header .logo b{color:var(--acc)}
header input#projName{width:180px}
header .sp{flex:1}
header select{width:auto}
#timeDisp{font-variant-numeric:tabular-nums;color:var(--mute);min-width:120px;text-align:center}

/* side panels */
aside{background:var(--panel);overflow:hidden;display:flex;flex-direction:column;min-height:0}
#left{border-right:1px solid var(--line)}
#right{border-left:1px solid var(--line)}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:0 0 auto}
.tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:9px 0;color:var(--mute);border-bottom:2px solid transparent;font-weight:700}
.tabs button.on{color:var(--text);border-bottom-color:var(--acc)}
.pane{padding:12px;overflow:auto;flex:1;min-height:0}

/* stage */
#stage{display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;background:#0c0d11;
  background-image:radial-gradient(#1b1e27 1px,transparent 1px);background-size:18px 18px}
#cv{box-shadow:0 10px 40px rgba(0,0,0,.6);border-radius:4px;background:#000}
#stageMsg{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);color:var(--mute);font-size:12px}

/* cards */
.card{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:9px;margin-bottom:8px}
.card.sel{border-color:var(--acc)}
.pl{display:grid;grid-template-columns:30px 1fr auto;gap:7px;align-items:center}
.pl .sw{width:30px;height:30px;border-radius:50%}
.pl .thumb{width:44px;height:44px;border-radius:6px;object-fit:cover;background:#111}
.tpl{cursor:pointer}
.tpl b{display:block;margin-bottom:2px}
.badge{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:9px;background:#33394a;color:#c9cfdd;margin-left:4px}
.assets{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.asset{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px;position:relative;font-size:11px;overflow:hidden}
.asset img{width:100%;height:70px;object-fit:cover;border-radius:4px;display:block;background:#111}
.asset .au{height:70px;display:flex;align-items:center;justify-content:center;font-size:26px;background:#111;border-radius:4px}
.asset .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.asset .x{position:absolute;top:3px;right:3px;padding:0 6px;background:rgba(0,0,0,.6);border:0}
.drop{border:1.5px dashed #444b5e;border-radius:var(--r);padding:14px;text-align:center;color:var(--mute);cursor:pointer;margin-bottom:10px}
.drop.on{border-color:var(--acc);color:var(--text)}

/* timeline */
#timeline{grid-column:1/-1;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#tlBar{display:flex;align-items:center;gap:6px;padding:6px 10px;border-bottom:1px solid var(--line)}
#tlBar .sp{flex:1}
#tlWrap{flex:1;overflow:auto;position:relative;min-height:0}
#tlInner{position:relative;min-height:100%;padding-left:70px}
.lane-label{position:absolute;left:0;width:66px;color:var(--mute);font-size:11px;padding-left:10px;display:flex;align-items:center}
#ruler{position:relative;height:24px;border-bottom:1px solid var(--line);cursor:pointer}
#ruler .tk{position:absolute;top:0;height:100%;border-left:1px solid #343a4a;font-size:10px;color:var(--mute);padding-left:3px}
#lane{position:relative;height:74px;margin-top:8px}
.blk{position:absolute;top:0;height:100%;border-radius:7px;padding:6px 8px;overflow:hidden;cursor:grab;user-select:none;border:2px solid transparent;
  background:#2a3042;display:flex;flex-direction:column;justify-content:space-between}
.blk.sel{border-color:var(--acc)}
.blk .t{font-weight:800;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .d{font-size:10.5px;color:#cfd5e4;opacity:.8}
.blk .h{position:absolute;right:0;top:0;width:8px;height:100%;cursor:ew-resize;background:rgba(255,255,255,.08)}
.blk.drag{opacity:.6;cursor:grabbing;z-index:5}
.blk .tr{position:absolute;left:0;top:0;bottom:0;width:6px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.35) 0 3px,transparent 3px 6px)}
#alane{position:relative;height:34px;margin-top:8px}
#beatGrid{position:absolute;top:24px;bottom:0;left:70px;pointer-events:none;display:none}
.bgm{position:absolute;top:4px;height:26px;border-radius:6px;background:linear-gradient(90deg,#1e5a46,#246b54);font-size:11px;padding:5px 8px;white-space:nowrap;overflow:hidden}
.cue{position:absolute;top:0;width:10px;height:10px;margin-left:-5px;transform:rotate(45deg);background:var(--acc);border:1px solid #000}
.cue.c2{top:16px;background:#7aa8ff}
#phead{position:absolute;top:0;bottom:0;width:2px;background:var(--danger);pointer-events:none;z-index:10}
#phead::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:var(--danger)}
#insertMark{position:absolute;top:30px;height:80px;width:3px;background:var(--acc);display:none;z-index:9}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100}
.modal.on{display:flex}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(980px,94vw);max-height:90vh;display:flex;flex-direction:column}
.dlg>.hd{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;font-weight:900;font-size:14px}
.dlg>.hd .sp{flex:1}
.dlg>.bd{padding:14px 16px;overflow:auto}
.dlg>.ft{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:0 10px}
table.st{width:100%;border-collapse:collapse}
table.st th{color:var(--mute);font-weight:700;font-size:11px;text-align:left;padding:4px}
table.st td{padding:3px}
table.st input,table.st select{padding:4px 5px}
.prog{height:10px;background:#0f1116;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.prog>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#ff6a3d);transition:width .15s}
#toast{position:fixed;bottom:236px;left:50%;transform:translateX(-50%);background:#000c;border:1px solid var(--line);padding:8px 14px;border-radius:8px;display:none;z-index:200;max-width:80vw}
.chk{display:flex!important;gap:8px;align-items:center;flex-direction:row}
.chk>span{display:inline!important;margin:0!important;flex:1}
.kbd{font-family:ui-monospace,monospace;background:#2a2f3d;border-radius:4px;padding:0 5px;font-size:11px}
</style>
</head>
<body>
<header>
  <div class="logo">地理動画<b>エディター</b></div>
  <input id="projName" title="プロジェクト名">
  <select id="fmtSel" title="画面サイズ">
    <option value="9:16">9:16 縦(ショート)</option><option value="16:9">16:9 横</option><option value="4:3">4:3 横</option><option value="1:1">1:1 正方形</option><option value="4:5">4:5</option>
  </select>
  <select id="styleSel" title="デザインスタイル"><option value="edit">スタイル: シネマ</option><option value="battle">スタイル: バトル</option></select>
  <select id="motionSel" title="演出の激しさ（全体プリセット）"></select>
  <button id="undoBtn" title="元に戻す (Ctrl+Z)">↶</button><button id="redoBtn" title="やり直し (Ctrl+Shift+Z)">↷</button>
  <div class="sp"></div>
  <button id="playBtn" class="nf" style="min-width:64px">▶ 再生</button>
  <span id="timeDisp">0:00.0 / 0:00.0</span>
  <div class="sp"></div>
  <button id="newBtn">新規</button>
  <button id="openBtn">開く</button>
  <button id="saveBtn">保存</button>
  <button id="exportBtn" class="pri">MP4書き出し</button>
</header>

<aside id="left">
  <div class="tabs" id="ltabs">
    <button data-t="tpl" class="on">テンプレ</button><button data-t="data">データ</button><button data-t="players">出場者</button><button data-t="assets">素材</button><button data-t="audio">音声</button>
  </div>
  <div class="pane" id="lpane"></div>
</aside>

<main id="stage"><canvas id="cv"></canvas><div id="stageMsg"></div></main>

<aside id="right">
  <div class="tabs"><button class="on" style="cursor:default">インスペクタ</button></div>
  <div class="pane" id="insp"></div>
</aside>

<section id="timeline">
  <div id="tlBar">
    <select id="addSel" style="width:auto"></select><button id="addBtn">＋ シーン追加</button>
    <button id="dupBtn">複製</button><button id="delBtn" class="danger">削除</button>
    <button id="genBtn" title="テンプレートと出場者から構成を作り直す">構成を自動生成</button>
    <div class="sp"></div>
    <span class="mute small">ズーム</span><input type="range" id="zoom" min="20" max="300" value="110" style="width:120px">
  </div>
  <div id="tlWrap"><div id="tlInner">
    <div class="lane-label" style="top:32px;height:74px">シーン</div>
    <div class="lane-label" style="top:114px;height:34px">音声</div>
    <div id="ruler"></div><div id="lane"></div><div id="alane"></div>
    <div id="beatGrid"></div><div id="phead"></div><div id="insertMark"></div>
  </div></div>
</section>

<!-- template editor -->
<div class="modal" id="tplModal"><div class="dlg">
  <div class="hd">テンプレートエディター<span class="sp"></span><button class="ghost" id="tplJsonBtn">JSONで編集</button><button class="ghost" data-close>✕</button></div>
  <div class="bd" id="tplBody"></div>
  <div class="ft">
    <span class="mute small" style="margin-right:auto;align-self:center" id="tplMsg"></span>
    <button id="tplSaveLib">ライブラリに保存</button>
    <button id="tplApply">適用（構成はそのまま）</button>
    <button id="tplApplyGen" class="pri">適用して構成を再生成</button>
  </div>
</div></div>

<!-- export -->
<div class="modal" id="expModal"><div class="dlg" style="width:min(520px,94vw)">
  <div class="hd">MP4書き出し<span class="sp"></span><button class="ghost" data-close>✕</button></div>
  <div class="bd">
    <div class="grid2">
      <label class="f"><span>フレームレート</span><select id="expFps"><option>30</option><option>60</option><option>24</option></select></label>
      <label class="f"><span>ビットレート (Mbps)</span><input id="expBr" type="number" value="12" min="2" max="50"></label>
      <label class="f"><span>解像度</span><select id="expScale"><option value="1">フル (1080p)</option><option value="0.6667">720p</option></select></label>
      <label class="f"><span>ファイル名</span><input id="expName"></label>
    </div>
    <div class="prog"><i id="expBar"></i></div>
    <p class="hint" id="expMsg">ブラウザ内で1フレームずつ描画してエンコードします（実時間より速いことが多いです）。Chrome / Edge 推奨。</p>
  </div>
  <div class="ft"><button id="expCancel">キャンセル</button><button id="expGo" class="pri">書き出し開始</button></div>
</div></div>

<div id="toast"></div>
<input type="file" id="fileAny" hidden>
<datalist id="dlSheets"></datalist><datalist id="dlCols"></datalist>

function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

  if (v == null || v === '') return NaN;
  if (typeof v === 'number') return v;
  const s = String(v).normalize('NFKC').replace(/[,\s]/g, '');
  const m = s.match(/-?\d+(?:\.\d+)?/);
  return m ? parseFloat(m[0]) : NaN;
}
function fmtNum(v, st, dec) {
  if (!isFinite(v)) return '—';
  const d = dec ?? (st.decimals | 0);
  const s = st.comma === false ? v.toFixed(d) : v.toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d });
  return (st.prefix || '') + s + (st.unit || '');
}

function rgba(h, a) { const [r, g, b] = hexRgb(h); return `rgba(${r},${g},${b},${a})`; }

  const s = Math.max(w / iw, h / ih) * zoom; const dw = iw * s, dh = ih * s;

function sText(ctx, S, text, x, y, o = {}) {

  let size = o.size || 60 * S.k; const w = o.weight || 900;
  ctx.font = S.font(size, w);
  if (o.maxW) { const m = ctx.measureText(text).width; if (m > o.maxW) { size *= o.maxW / m; ctx.font = S.font(size, w); } }
  ctx.textAlign = o.align || 'left'; ctx.textBaseline = o.base || 'alphabetic';

/* ---------------- IndexedDB (素材の永続化) ---------------- */
const IDB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('geo-video-editor', 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('assets', { keyPath: 'id' }); r.result.createObjectStore('kv'); };
      r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => rej(r.error);
    });
  },
  async tx(store, mode, fn) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction(store, mode); const s = t.objectStore(store); const r = fn(s); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }); },
  put(store, v, k) { return this.tx(store, 'readwrite', s => s.put(v, k)); },
  del(store, k) { return this.tx(store, 'readwrite', s => s.delete(k)); },
  get(store, k) { return this.tx(store, 'readonly', s => s.get(k)); },
  all(store) { return this.tx(store, 'readonly', s => s.getAll()); },
};

const Data = {
  source: { type: 'sample', sheetId: DEFAULT_GSHEET },
  sheets: {},          // name -> rows[][]
  ver: 0,
  loading: {},
  knownNames() { return [...new Set([...Object.keys(this.sheets), ...Object.keys(SAMPLE || {}), ...(this.extraNames || [])])]; },
  async init() {
    try { const s = JSON.parse(localStorage.getItem('gve.source') || 'null'); if (s) this.source = s; } catch { }
    if (this.source.type === 'sample') this.sheets = clone(SAMPLE || {});
    else { const saved = await IDB.get('kv', 'sheets').catch(() => null); if (saved) this.sheets = saved; }
  },
  async setSource(src, sheets) {
    this.source = src; localStorage.setItem('gve.source', JSON.stringify(src));
    this.sheets = sheets || (src.type === 'sample' ? clone(SAMPLE || {}) : {}); this.ver++;
    await IDB.put('kv', this.sheets, 'sheets').catch(() => { });
  },
  gvizURL(id, name) { return `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&headers=0&sheet=${encodeURIComponent(name)}`; },
  async fetchGoogle(name) {
    const r = await fetch(this.gvizURL(this.source.sheetId, name));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const txt = await r.text();
    if (/^\s*</.test(txt)) throw new Error('共有設定が「リンクを知っている全員」になっていない可能性があります');
    return parseCSV(txt);
  },
  /** シートが使える状態にする (Googleなら取得) */
  async ensure(name, force) {
    if (!name) return false;
    if (this.sheets[name] && !force) return true;
    if (this.source.type === 'google') {
      if (this.loading[name]) return this.loading[name];
      this.loading[name] = (async () => {
        try { this.sheets[name] = await this.fetchGoogle(name); this.ver++; IDB.put('kv', this.sheets, 'sheets').catch(() => { }); return true; }
        catch (e) { toast(`「${name}」を取得できません: ${e.message}`, 5000); return false; }
        finally { delete this.loading[name]; }
      })();
      return this.loading[name];
    }
    return false;
  },
  /** headerRow は1始まり */
  table(name, headerRow = 1) {
    const rows = this.sheets[name]; if (!rows) return null;
    const hi = Math.max(0, (headerRow | 0) - 1);
    const seen = {};
    const headers = (rows[hi] || []).map((h, i) => {
      let n = String(h ?? '').replace(/\s+/g, '').trim() || `列${i + 1}`;
      if (seen[n]) n = n + '_' + (++seen[n]); else seen[n] = 1;
      return n;
    });
    const records = rows.slice(hi + 1).map(r => { const o = {}; headers.forEach((h, i) => o[h] = r[i] ?? ''); return o; });
    return { headers, records };
  },
  entities(tpl) {
    const d = tpl.data; const tb = this.table(d.sheet, d.headerRow); if (!tb) return [];
    const out = [], seen = {};
    for (const row of tb.records) {
      const name = String(row[d.keyCol] ?? '').trim();
      if (!name || name.startsWith('#')) continue;
      const sub = d.subCol ? String(row[d.subCol] ?? '').trim() : '';
      let id = name + (sub ? '｜' + sub : ''); if (seen[id]) id += '#' + (++seen[id]); else seen[id] = 1;
      out.push({ id, name, sub, row });
    }
    return out;
  },
};

const Player = {
  playing: false, nodes: [], base: 0, from: 0,
  play() {
    if (!P.scenes.length) return;
    const total = totalDur(); if (playhead >= total - .05) playhead = 0;
    const actx = getActx(); actx.resume();
    this.from = playhead; this.base = actx.currentTime + .06;
    this.nodes = scheduleAudio(actx, actx.destination, this.from, total, this.base);
    this.playing = true; $('#playBtn').textContent = '❚❚ 停止';
    const loop = () => { if (!this.playing) return; const t = this.from + Math.max(0, actx.currentTime - this.base); if (t >= total) { setPlayhead(total); this.stop(); return; } setPlayhead(t, true); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  },
  stop() { this.playing = false; this.nodes.forEach(n => { try { n.stop(); } catch { } }); this.nodes = []; $('#playBtn').textContent = '▶ 再生'; },
  toggle() { this.playing ? this.stop() : this.play(); },

async function readSheetFile(f) {
  if (/\.csv$/i.test(f.name)) return { [f.name.replace(/\.csv$/i, '')]: parseCSV(await f.text()) };
  if (!window.XLSX) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
  const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' }), out = {};
  wb.SheetNames.forEach(n => out[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: false, defval: '' }).map(r => r.map(c => String(c ?? ''))));
  return out;
}
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('ライブラリ読込失敗')); document.head.append(s); }); }

/* ---- timeline ---- */
const pps = () => +$('#zoom').value;
function renderTimeline() {
  const tl = timeline(), total = totalDur(), px = pps(), width = Math.max((total + 6) * px, $('#tlWrap').clientWidth - 80);
  $('#tlInner').style.width = (width + 70) + 'px';
  const ruler = $('#ruler'); ruler.innerHTML = ''; ruler.style.width = width + 'px';
  const step = px > 90 ? 1 : px > 40 ? 2 : 5;
  for (let s = 0; s * px < width; s += step) ruler.append(h(`<div class="tk" style="left:${s * px}px">${fmtTime(s).replace(/\.0$/, '')}</div>`));
  const lane = $('#lane'); lane.innerHTML = '';
  tl.forEach(e => {
    const s = e.scene, ST = SceneTypes[s.type] || {};
    let lbl = ST.label || s.type;
    if (s.type === 'round') { const st = statById(s.props.statId); lbl = `${roundNumber(e.index)}. ${st?.label || '未設定'}${st?.better === 'manual' ? (s.props.judge ? ' ⚑' : ' ⚑未判定') : ''}`; }
    if (s.type === 'text') lbl = 'T: ' + (s.props.text || '').split('\n')[0];
    const b = h(`<div class="blk ${s.id === sel ? 'sel' : ''}" style="left:${e.start * px}px;width:${Math.max(8, s.dur * px - 3)}px;background:${ST.color || '#333'}">
      ${s.transition && s.transition !== 'none' && e.index ? '<i class="tr"></i>' : ''}<div class="t">${esc(lbl)}</div><div class="d">${s.dur.toFixed(1)}s${s.caption ? ' ・💬' : ''}</div><div class="h"></div></div>`);
    b.dataset.i = e.index; b.onpointerdown = ev => blkDown(ev, e, b); lane.append(b);
  });
  const al = $('#alane'); al.innerHTML = '';
  const bgm = Assets.get(P.audio.bgmId);
  const BL = Tempo.beatLen(), bg = $('#beatGrid');
  if (BL && P.audio.grid) {
    const w = BL * px, f = Tempo.firstBeat() * px;
    bg.style.display = 'block'; bg.style.width = width + 'px';
    bg.style.backgroundImage = `repeating-linear-gradient(90deg, rgba(255,176,32,.55) 0 2px, transparent 2px ${w * 4}px), repeating-linear-gradient(90deg, rgba(255,255,255,.13) 0 1px, transparent 1px ${w}px)`;
    bg.style.backgroundPosition = `${f}px 0, ${f}px 0`;
  } else bg.style.display = 'none';
  if (bgm?.buf) { const len = P.audio.bgmLoop ? total : Math.min(total, (bgm.buf.duration - (+P.audio.bgmTrim || 0)) / (+P.audio.bgmRate || 1)); al.append(h(`<div class="bgm" style="left:0;width:${Math.max(0, len * px)}px">♪ ${esc(bgm.name)}</div>`)); }
  cues().forEach(c => { const a = Assets.get(c.assetId); al.append(h(`<div class="cue ${c.custom ? 'c2' : ''}" style="left:${c.t * px}px" title="${esc((SE_KEYS.find(k => k[0] === c.key) || [, '追加'])[1])}: ${esc(a?.name)}"></div>`)); });
  $('#phead').style.left = (70 + playhead * px) + 'px';
  $('#undoBtn').disabled = !hist.undo.length; $('#redoBtn').disabled = !hist.redo.length;
}
function blkDown(ev, e, b) {
  ev.preventDefault(); const px = pps(), startX = ev.clientX, s = e.scene, resize = ev.target.classList.contains('h');
  const snap = snapshot(); let moved = false, target = e.index;
  if (sel !== s.id) { sel = s.id; renderInspector(); $$('.blk').forEach(x => x.classList.toggle('sel', x === b)); }
  const startDur = s.dur, mark = $('#insertMark');
  const move = m => {
    const dx = m.clientX - startX; if (Math.abs(dx) > 4) moved = true; if (!moved) return;
    if (resize) { const raw = startDur + dx / px, BL = Tempo.beatLen(); s.dur = BL && P.audio.snap && !m.altKey ? Math.max(BL / 2, +(Tempo.snapTime(e.start + raw) - e.start).toFixed(4)) : Math.max(.3, Math.round(raw * 10) / 10); renderTimeline(); setPlayhead(Math.min(playhead, totalDur())); }
    else {
      b.classList.add('drag'); b.style.transform = `translateX(${dx}px)`;
      const x = (e.start * px + dx + s.dur * px / 2) / px, tl = timeline();
      target = tl.filter(t => t.index !== e.index).filter(t => (t.start + t.end) / 2 < x).length;
      const others = tl.filter(t => t.index !== e.index); const at = target < others.length ? others[target].start - (others[target].index > e.index ? s.dur : 0) : totalDur() - s.dur;
      mark.style.display = 'block'; mark.style.left = (70 + Math.max(0, at) * px - 1) + 'px';
    }
  };
  const up = () => {
    removeEventListener('pointermove', move); removeEventListener('pointerup', up); mark.style.display = 'none';
    if (!moved) { const r = b.getBoundingClientRect(); setPlayhead(e.start + clamp((startX - r.left) / px, 0, s.dur - .01)); renderTimeline(); return; }
    pushUndo(snap);
    if (!resize && target !== e.index) { const [it] = P.scenes.splice(e.index, 1); P.scenes.splice(target, 0, it); }
    changed({ left: false });
  };
  addEventListener('pointermove', move); addEventListener('pointerup', up);
}
$('#ruler').onpointerdown = ev => {
  const seek = m => setPlayhead((m.clientX - $('#ruler').getBoundingClientRect().left) / pps());
  seek(ev); const up = () => { removeEventListener('pointermove', seek); removeEventListener('pointerup', up); };
  addEventListener('pointermove', seek); addEventListener('pointerup', up);
};
$('#lane').onpointerdown = ev => { if (ev.target.id === 'lane') { sel = null; setPlayhead(ev.offsetX / pps()); renderTimeline(); renderInspector(); } };
$('#zoom').oninput = () => renderTimeline();

function makeScene(type, props = {}) {
  const ST = SceneTypes[type], d = P.template.durations;
  return { id: uid(), type, dur: d[type] || 3, transition: type === 'intro' || styleOf() === 'edit' ? 'none' : type === 'round' ? (P.scenes.some(s => s.type === 'round') ? 'none' : 'slash') : ['result', 'scoreboard'].includes(type) ? 'slash' : 'punch', caption: '', captionPos: 'bottom', seId: '', seAt: 0, props: { ...ST.defaults(), ...props } };
}
function generateScenes() {
  const T = P.template, st = T.structure, out = [];
  if (st.intro) out.push(makeScene('intro'));
  const stats = T.stats.filter(s => !s.skip);
  stats.forEach((s, i) => { out.push(makeScene('round', { statId: s.id })); if (st.midEvery > 0 && (i + 1) % st.midEvery === 0 && i < stats.length - 1) out.push(makeScene('scoreboard')); });
  if (st.result) out.push(makeScene('result'));
  let first = true; out.forEach(s => { if (s.type === 'round') { s.transition = first && styleOf() !== 'edit' ? 'slash' : 'none'; first = false; } });
  sel = null; return out;
}

function dupScene() { const i = P.scenes.findIndex(s => s.id === sel); if (i < 0) return; const c = clone(P.scenes[i]); c.id = uid(); commit(() => P.scenes.splice(i + 1, 0, c)); sel = c.id; changed(); }
function delScene() { const i = P.scenes.findIndex(s => s.id === sel); if (i < 0) return; commit(() => P.scenes.splice(i, 1)); sel = P.scenes[Math.min(i, P.scenes.length - 1)]?.id || null; changed(); }

$('#addBtn').onclick = () => { const t = $('#addSel').value, props = {}; if (t === 'round') props.statId = P.template.stats[0]?.id || ''; const s = makeScene(t, props); commit(() => P.scenes.splice(insertIndex(), 0, s)); sel = s.id; changed(); };

    $$('[data-mo]', b).forEach(i => i.oninput = () => { t.motion[i.dataset.mo] = +i.value; t.motion.preset = 'custom'; tm.value = 'custom'; $(`[data-mv-l="${i.dataset.mo}"]`, b).textContent = (+i.value).toFixed(1); });
    $$('tr[data-i]', b).forEach(tr => {
      const s = t.stats[+tr.dataset.i];
      $('select', tr).value = s.better;
      $$('[data-s]', tr).forEach(i => i.onchange = () => {
        const k = i.dataset.s;
        if (k === 'use') s.skip = !i.checked; else if (k === 'comma') s.comma = i.checked; else if (k === 'decimals') s.decimals = +i.value; else s[k] = i.value;
        if (['col', 'expr', 'display', 'decimals', 'unit', 'prefix', 'comma', 'better'].includes(k)) tr.querySelector('td.small').textContent = sampleVal(t, s);
      });
      $('[data-rm]', tr).onclick = () => { t.stats.splice(+tr.dataset.i, 1); this.render(); };
      $$('[data-mv]', tr).forEach(btn => btn.onclick = () => { const i = +tr.dataset.i, j = i + +btn.dataset.mv; if (j < 0 || j >= t.stats.length) return; [t.stats[i], t.stats[j]] = [t.stats[j], t.stats[i]]; this.render(); });
    });
    $('#tAddStat', b).onclick = () => { t.stats.push(fixTemplate({ stats: [{ label: '新しい項目', col: tb?.headers[0] || '' }] }).stats[0]); this.render(); };
    $('#tLoad', b).onclick = async () => { await Data.ensure(t.data.sheet, true); this.render(); };
    if (!tb) Data.ensure(t.data.sheet).then(ok => ok && this.t === t && !this.json && this.render());
  },
  read() {
    if (this.json) { try { this.t = fixTemplate(JSON.parse($('#tjson').value)); } catch (e) { toast('JSONエラー: ' + e.message, 4000); return null; } }
    return this.t;
  },
};
function sampleVal(t, s) { const ent = Data.entities(t)[0]; if (!ent) return ''; const v = statValue(s, ent.row); return `${ent.name}: ${fmtNum(v, s)}`; }
$('#tplJsonBtn').onclick = () => { if (!TplEditor.read()) return; TplEditor.json = !TplEditor.json; TplEditor.render(); };
$('#tplSaveLib').onclick = () => { const t = TplEditor.read(); if (!t) return; if (t.builtin || Templates.get(t.id)?.builtin) { t.id = 'u_' + uid(); t.name += '（カスタム）'; } delete t.builtin; Templates.upsert(t); toast('ライブラリに保存しました'); TplEditor.render(); renderLeft(); };
const applyTpl = async regen => {
  const t = TplEditor.read(); if (!t) return; await ensureDeps(t);
  commit(() => {
    P.template = clone(t);
    const ents = Data.entities(t); P.players.forEach(p => { const e = ents.find(x => x.id === p.key) || ents.find(x => x.name === p.name); if (e) { p.row = e.row; p.key = e.id; } });
    if (regen) P.scenes = generateScenes();
    else P.scenes.forEach(s => { if (s.type === 'round' && !statById(s.props.statId)) s.props.statId = t.stats[0]?.id || ''; });
  });
  TplEditor.close(); toast('テンプレートを適用しました');
};
$('#tplApply').onclick = () => applyTpl(false);
$('#tplApplyGen').onclick = () => applyTpl(true);
$$('[data-close]').forEach(b => b.onclick = () => b.closest('.modal').classList.remove('on'));

/* ---- files ---- */
function pickFile(accept, cb, cbMulti, multi) { const i = $('#fileAny'); i.accept = accept; i.multiple = !!multi; i.value = ''; i.onchange = () => { const fs = [...i.files]; if (multi) cbMulti(fs); else if (fs[0]) cb(fs[0]); }; i.click(); }
function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); }
const blobToDataURL = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });
$('#saveBtn').onclick = async () => {
  const used = new Set([P.audio.bgmId, ...Object.values(P.audio.se), ...P.players.map(p => p.imageId), ...P.scenes.flatMap(s => [s.seId, s.props.imageId, s.props.bgId])]);
  P.players.forEach(p => { if (!p.imageId) { const b = playerImage(p); const a = Assets.list.find(x => x.bmp === b); if (a) used.add(a.id); } });
  const assets = [];
  for (const a of Assets.list) if (used.has(a.id)) assets.push({ id: a.id, name: a.name, kind: a.kind, mime: a.mime, data: await blobToDataURL(a.blob) });
  download(new Blob([JSON.stringify({ gve: 1, project: P, assets })], { type: 'application/json' }), (P.name || 'project') + '.gvproj.json');
  toast('使用中の素材も含めて保存しました');
};
$('#openBtn').onclick = () => pickFile('.json', async f => {
  try {
    const j = JSON.parse(await f.text()); if (!j.project) throw new Error('プロジェクトファイルではありません');
    for (const a of j.assets || []) if (!Assets.get(a.id)) {
      const blob = await (await fetch(a.data)).blob(); const file = new File([blob], a.name, { type: a.mime || blob.type });
      const rec = { id: a.id, name: a.name, kind: a.kind, mime: a.mime, blob: file, t: Date.now() }; await IDB.put('assets', rec); await Assets._prepare(rec); Assets.list.push(rec);
    }
    Assets.reindex(); pushUndo(); P = j.project; P.template = fixTemplate(P.template); migrateScenes(P); normAudio(P); sel = null; changed(); fitCanvas(); toast('プロジェクトを開きました');
  } catch (e) { toast('読込失敗: ' + e.message, 4000); }
});
$('#newBtn').onclick = () => { if (!confirm('新しいプロジェクトを作りますか？（Ctrl+Zで戻せます）')) return; commit(() => { P = newProject(P.template); sel = null; }); ltab = 'players'; $$('#ltabs button').forEach(x => x.classList.toggle('on', x.dataset.t === 'players')); renderLeft(); };
$('#projName').onchange = e => commit(() => P.name = e.target.value, { left: false });
function syncMotionSel() { $('#styleSel').value = styleOf(); const m = P.template.motion; $('#motionSel').innerHTML = Object.entries(MOTION_PRESETS).map(([k, v]) => `<option value="${k}">演出: ${v.label}</option>`).join('') + (m.preset === 'custom' ? '<option value="custom">演出: カスタム</option>' : ''); $('#motionSel').value = m.preset; }
$('#styleSel').onchange = e => commit(() => { P.template.theme.style = e.target.value; P.scenes.forEach(s => { if (e.target.value === 'edit' && ['slash', 'punch', 'whip', 'flash'].includes(s.transition)) s.transition = 'none'; }); }, { left: false });
$('#motionSel').onchange = e => commit(() => applyMotionPreset(P.template.motion, e.target.value), { left: false });
$('#fmtSel').onchange = e => { commit(() => P.format = e.target.value, { left: false }); fitCanvas(); };
$('#playBtn').onclick = () => Player.toggle();
$('#undoBtn').onclick = undo; $('#redoBtn').onclick = redo;
addEventListener('resize', () => { fitCanvas(); renderTimeline(); });
addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,select') || $('.modal.on')) return;
  const tl = timeline();
  if (e.code === 'Space') { e.preventDefault(); Player.toggle(); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
    e.preventDefault(); const d = e.key === 'ArrowRight' ? 1 : -1;
    if (e.shiftKey) { const cur = tl.findIndex(x => playhead < x.end - .001); const n = tl[clamp((cur < 0 ? tl.length : cur) + d, 0, tl.length - 1)]; if (n) setPlayhead(n.start); }
    else setPlayhead(playhead + d * .1);
  }
  else if ((e.key === 'Delete' || e.key === 'Backspace') && sel) { e.preventDefault(); delScene(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd') { e.preventDefault(); dupScene(); }
});

/* ---------------- 8. Export ---------------- */
const Exporter = {
  cancel: false, running: false,
  open() { if (!P.scenes.length) return toast('シーンがありません'); Player.stop(); $('#expName').value = (P.name || 'video').replace(/[\\/:*?"<>|]/g, '_'); $('#expBar').style.width = '0'; $('#expMsg').textContent = window.VideoEncoder ? 'ブラウザ内で1フレームずつ描画してエンコードします（実時間より速いことが多いです）。' : 'このブラウザはWebCodecs非対応のため、実時間で録画します（WebM/MP4はブラウザ依存）。Chrome / Edge 推奨。'; $('#expGo').disabled = false; $('#expModal').classList.add('on'); },
  msg(s) { $('#expMsg').textContent = s; },
  async pickCodec(w, h, fps, br) {
    for (const codec of ['avc1.640034', 'avc1.640033', 'avc1.640028', 'avc1.4d0034', 'avc1.4d0028', 'avc1.42003e', 'avc1.42e028']) {
      const cfg = { codec, width: w, height: h, bitrate: br, framerate: fps, avc: { format: 'avc' } };
      try { const r = await VideoEncoder.isConfigSupported(cfg); if (r.supported) return cfg; } catch { }
    }
    return null;
  },
  async run() {
    if (this.running) return; this.running = true; this.cancel = false; $('#expGo').disabled = true;
    try {
      const fps = +$('#expFps').value, sc = +$('#expScale').value, [W0, H0] = sizeOf();
      const W = Math.round(W0 * sc / 2) * 2, H = Math.round(H0 * sc / 2) * 2, total = totalDur(), frames = Math.ceil(total * fps);
      this.msg('フォントを準備中…'); await loadThemeFonts().catch(() => { });
      const canvas = document.createElement('canvas'); canvas.width = W; canvas.height = H; const ctx = canvas.getContext('2d', { alpha: false });
      if (!window.VideoEncoder) return await this.realtime(canvas, ctx, sc, total);
      const vcfg = await this.pickCodec(W, H, fps, +$('#expBr').value * 1e6);
      if (!vcfg) throw new Error('H.264エンコーダが使えません（Chrome/Edgeの最新版でお試しください）');
      let acfg = null;
      if (hasAudio() && window.AudioEncoder) {
        for (const [codec, mux] of [['mp4a.40.2', 'aac'], ['opus', 'opus']]) {
          const c = { codec, sampleRate: 48000, numberOfChannels: 2, bitrate: 192000 };
          try { if ((await AudioEncoder.isConfigSupported(c)).supported) { acfg = c; acfg.mux = mux; break; } } catch { }
        }
        if (!acfg) toast('このブラウザは音声エンコードに非対応のため、音声なしで書き出します', 5000);
        else if (acfg.mux === 'opus') toast('AAC非対応のため音声はOpusで書き出します（一部プレーヤーで再生不可の場合あり）', 5000);
      }
      const target = new Mp4Muxer.ArrayBufferTarget();
      const muxer = new Mp4Muxer.Muxer({ target, fastStart: 'in-memory', firstTimestampBehavior: 'offset', video: { codec: 'avc', width: W, height: H, frameRate: fps }, audio: acfg ? { codec: acfg.mux, numberOfChannels: 2, sampleRate: 48000 } : undefined });
      let encErr = null;
      const venc = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: e => encErr = e });
      venc.configure(vcfg);
      const t0 = performance.now();
      for (let i = 0; i < frames; i++) {
        if (this.cancel) throw new Error('キャンセルしました'); if (encErr) throw encErr;
        renderFrame(ctx, Math.min(i / fps, total - 1e-4), sc);
        const vf = new VideoFrame(canvas, { timestamp: Math.round(i * 1e6 / fps), duration: Math.round(1e6 / fps) });
        venc.encode(vf, { keyFrame: i % (fps * 2) === 0 }); vf.close();
        while (venc.encodeQueueSize > 6) await new Promise(r => setTimeout(r, 2));
        if (i % 6 === 0) { const p = i / frames; $('#expBar').style.width = (p * (acfg ? 88 : 98)) + '%'; const el = (performance.now() - t0) / 1000; this.msg(`映像 ${i}/${frames} フレーム　残り約${Math.ceil(el / Math.max(p, .01) - el)}秒`); await new Promise(r => setTimeout(r)); }
      }
      await venc.flush(); venc.close();
      if (acfg) {
        this.msg('音声をミックス中…');
        const sr = 48000, oac = new OfflineAudioContext(2, Math.ceil(total * sr), sr);
        scheduleAudio(oac, oac.destination, 0, total, 0);
        const buf = await oac.startRendering();
        const aenc = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: e => encErr = e });
        const { mux: _m, ...aconf } = acfg;
        const shift = await this.audioShift(aconf, acfg.mux).catch(() => 0);   // エンコーダ遅延の補正（サンプル数）
        aenc.configure(aconf);
        const sh = (a) => { if (shift > 0) { const o = new Float32Array(a.length + shift); o.set(a, shift); return o; } return shift < 0 ? a.subarray(-shift) : a; };
        const L = sh(buf.getChannelData(0)), R = sh(buf.getChannelData(1)), N = 1024, blen = L.length;
        for (let o = 0; o < blen; o += N) {
          const n = Math.min(N, blen - o), d = new Float32Array(n * 2); d.set(L.subarray(o, o + n), 0); d.set(R.subarray(o, o + n), n);
          const ad = new AudioData({ format: 'f32-planar', sampleRate: sr, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round(o * 1e6 / sr), data: d });
          aenc.encode(ad); ad.close();
          if (aenc.encodeQueueSize > 20) await new Promise(r => setTimeout(r, 1));
        }
        await aenc.flush(); aenc.close(); if (encErr) throw encErr;
      }
      muxer.finalize();
      $('#expBar').style.width = '100%';
      const blob = new Blob([target.buffer], { type: 'video/mp4' });
      download(blob, ($('#expName').value || 'video') + '.mp4');
      this.msg(`完了！ ${(blob.size / 1048576).toFixed(1)}MB　（${((performance.now() - t0) / 1000).toFixed(1)}秒で書き出し）`);
    } catch (e) { console.error(e); this.msg('エラー: ' + (e.message || e)); }
    finally { this.running = false; $('#expGo').disabled = false; }
  },
  /** エンコーダの遅延を実測し、再生側が捨てるサンプル数との差を返す（+なら先頭に無音を足す / −なら削る） */
  async audioShift(cfg, mux) {
    const sr = 48000, n = sr, X = 9600, chunks = []; let meta = null, err = null;
    const enc = new AudioEncoder({ output: (c, m) => { chunks.push(c); if (m?.decoderConfig) meta = m.decoderConfig; }, error: e => err = e });
    enc.configure(cfg);
    const pulse = new Float32Array(n); for (let i = 0; i < 480; i++) pulse[X + i] = Math.sin(i / 480 * Math.PI) * Math.sin(i * .35) * .9;
    for (let o = 0; o < n; o += 1024) { const m = Math.min(1024, n - o), d = new Float32Array(m * 2); d.set(pulse.subarray(o, o + m), 0); d.set(pulse.subarray(o, o + m), m); const ad = new AudioData({ format: 'f32-planar', sampleRate: sr, numberOfFrames: m, numberOfChannels: 2, timestamp: Math.round(o * 1e6 / sr), data: d }); enc.encode(ad); ad.close(); }
    await enc.flush(); enc.close(); if (err) throw err;
    const outs = []; const dec = new AudioDecoder({ output: ad => { const f = new Float32Array(ad.numberOfFrames); ad.copyTo(f, { planeIndex: 0, format: 'f32-planar' }); outs.push(f); ad.close(); }, error: e => err = e });
    dec.configure({ codec: cfg.codec, sampleRate: sr, numberOfChannels: 2, ...(meta?.description ? { description: meta.description } : {}) });
    chunks.forEach(c => dec.decode(c)); await dec.flush(); dec.close(); if (err) throw err;
    let all = new Float32Array(outs.reduce((a, b) => a + b.length, 0)), p = 0; outs.forEach(o => { all.set(o, p); p += o.length; });
    const env = a => { let bi = 0, bv = 0; for (let i = 0; i < a.length - 64; i += 8) { let s = 0; for (let j = 0; j < 64; j++) s += Math.abs(a[i + j]); if (s > bv) { bv = s; bi = i; } } return bi; };
    const delay = env(all) - env(pulse);
    // 説明情報があれば再生側も同じだけ捨てる（＝計測値に反映済み）。Opusで説明情報がない場合、muxerは3840を書くので再生側はその分捨てる
    const skip = mux === 'opus' && !meta?.description ? 3840 : 0;
    const shift = skip - delay;
    console.log('[export] audio delay', delay, 'player skip', skip, 'shift', shift);
    return Math.abs(shift) > 24000 ? 0 : shift;
  },
  /** WebCodecs非対応ブラウザ向け: 実時間録画 */
  async realtime(canvas, ctx, sc, total) {
    const stream = canvas.captureStream(30), actx = getActx(); await actx.resume();
    const dest = actx.createMediaStreamDestination(); dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
    const mime = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
    const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: +$('#expBr').value * 1e6 }), chunks = [];
    rec.ondataavailable = e => chunks.push(e.data);
    const done = new Promise(r => rec.onstop = r);
    const base = actx.currentTime + .1; const nodes = scheduleAudio(actx, dest, 0, total, base);
    rec.start();
    await new Promise(res => { const loop = () => { const t = actx.currentTime - base; if (this.cancel || t >= total) return res(); renderFrame(ctx, Math.max(0, t), sc); $('#expBar').style.width = (t / total * 100) + '%'; this.msg(`録画中… ${fmtTime(t)} / ${fmtTime(total)}`); requestAnimationFrame(loop); }; loop(); });
    nodes.forEach(n => { try { n.stop(); } catch { } }); rec.stop(); await done;
    const blob = new Blob(chunks, { type: mime }); download(blob, ($('#expName').value || 'video') + (mime.includes('mp4') ? '.mp4' : '.webm')); this.msg('完了しました');
  },
};
$('#exportBtn').onclick = () => Exporter.open();
$('#expGo').onclick = () => Exporter.run();
$('#expCancel').onclick = () => { if (Exporter.running) Exporter.cancel = true; else $('#expModal').classList.remove('on'); };

/* ---------------- boot ---------------- */
(async function boot() {
  Templates.load();
  await Data.init();
  await Assets.load();
  try { const s = localStorage.getItem('gve.project2'); if (s) { P = JSON.parse(s); P.template = fixTemplate(P.template); migrateScenes(P); normAudio(P); } } catch { }
  if (!P) {
    P = newProject(BUILTIN_TEMPLATES[0]);
    const ents = Data.entities(P.template);
    ['湊浜', '長海'].forEach(n => { const e = ents.find(x => x.name === n); if (e) P.players.push({ id: uid(), key: e.id, name: e.name, sub: e.sub, row: e.row, color: '', imageId: '' }); });
    P.scenes = generateScenes();
  }
  ensureDeps(P.template).then(() => changed());
  $('#projName').value = P.name; $('#fmtSel').value = P.format; syncMotionSel();
  renderLeft(); renderInspector(); renderTimeline(); fitCanvas(); setPlayhead(Math.min(1.6, totalDur())); preloadFonts();
  document.fonts.ready.then(drawPreview);
})();
